[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calg-contact"
version = "0.4.0"
description = "Contact-Aligned Local Graph contact prototype with baselines, convergence, robustness, GPU benchmark harness, TDI CCD, and implicit dynamics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "CALG prototype"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
test = ["pytest>=7.0"]
baseline = ["trimesh>=4.0"]

[project.scripts]
calg-run-validation = "calg.frontend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
